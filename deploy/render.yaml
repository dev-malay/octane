# Render Blueprint - deploys the perps backend on the FREE tier (no card).
#   Frontend  -> Vercel
#   Postgres  -> Neon      (set DATABASE_URL below)
#   Redis     -> Upstash   (set REDIS_URL below)
# Reuses the Docker images in deploy/. Both services sleep after ~15 min idle
# and cold-start (~1 min) on the next request - fine for a demo.

services:
  # Public REST API + engine + db-poller + binance-ws (all in one service).
  - type: web
    name: perp-api
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLISH_INTERVAL_MS
        value: "3000"
      # Paste from Neon (include ?sslmode=require).
      - key: DATABASE_URL
        sync: false
      # Paste from Upstash (rediss://...).
      - key: REDIS_URL
        sync: false
      # Your Vercel URL, e.g. https://your-app.vercel.app
      - key: FRONTEND_URL
        sync: false
      - key: USER_JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true

  # Public WebSocket feed.
  - type: web
    name: perp-ws
    runtime: docker
    dockerfilePath: ./apps/ws/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Must be the SAME Upstash URL as perp-api.
      - key: REDIS_URL
        sync: false

# Postgres (Neon) and Redis (Upstash) are external managed services.
# Create them first, then paste the connection strings above.
# Free tiers: Neon (0.5 GB), Upstash (10k commands/day).