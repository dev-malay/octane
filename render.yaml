services:
  - type: web
    name: perp-api
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: USER_JWT_SECRET
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLISH_INTERVAL_MS
        value: "3000"

  - type: web
    name: perp-ws
    runtime: docker
    dockerfilePath: ./apps/ws/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        sync: false

  - type: redis
    name: perp-redis
    plan: free
    region: singapore
    ipAllowList: []